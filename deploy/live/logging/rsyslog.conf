# Dedicated host receiver. No system/kernel inputs and no trading-state access.
global(workDirectory="/var/lib/algotrading-logs" maxMessageSize="256k")
module(load="imtcp")
module(load="omprog")

template(name="ServiceLogLine" type="list") {
    property(name="timegenerated" dateFormat="rfc3339" date.inUTC="on")
    constant(value=" service=")
    property(name="app-name")
    constant(value=" source_time=")
    property(name="timereported" dateFormat="rfc3339" date.inUTC="on")
    constant(value=" severity=")
    property(name="syslogseverity-text")
    constant(value=" ")
    property(name="$.safe_message")
    constant(value="\n")
}

ruleset(name="ServiceLogs") {
    # Tags come from Docker container names, never a user-provided filesystem path.
    if not re_match($app-name, "^algotrading[.][A-Za-z0-9_.-]+\$") then stop
    set $.safe_message = $msg;
    set $.lower_message = tolower($msg);
    # Defensive filtering; services must still avoid emitting secrets themselves.
    if re_match($.lower_message, "(password|passwd|secret|token|api[_-]?key|authorization)[\" ']*[:=]") or
       re_match($.lower_message, "[a-z]+://[^ /]+:[^ /]+@") or
       re_match($.lower_message, "bot[0-9]+:[a-z0-9_-]+") or
       ($msg contains "-----BEGIN") then {
        set $.safe_message = "[REDACTED: credential-bearing diagnostic message]";
    }
    # The writer checks 50 MiB before appending and retains recent complete lines.
    # A single owner avoids racing the active file during size trimming.
    action(type="omprog" template="ServiceLogLine" confirmMessages="on"
           forceSingleInstance="on"
           binary="/usr/bin/python3 /usr/local/lib/algotrading/clean_daily_logs.py --receive --root /var/log/algotrading/services --max-bytes 52428800")
    stop
}

# Docker's Linux host daemon connects here; this port is never publicly exposed.
input(type="imtcp" Address="127.0.0.1" Port="5514" ruleset="ServiceLogs")
