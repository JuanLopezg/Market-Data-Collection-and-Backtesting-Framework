# algoTrading chain: every service, its mounts and ports in one file.
#
# Use it through ./algo (same directory). The script sets the host folders:
#   ALGO_DATA   = <root>/data          host-level data (telemetry, Kraken account monitor)
#   ALGO_STATE  = trading state: <root>/data in PAPER, <root>/data/live in LIVE, so the two
#                 modes never share NATS, PostgreSQL, market data or dashboard stores
#   ALGO_CONFIG = <root>/config        non-secret configuration (read-only here)
# and loads chain.env (non-secret settings) plus <root>/secrets/chain.env.
#
# MODE in chain.env selects the execution venue (./algo turns it into a compose profile):
#   paper  public Binance market data, virtual funds, `gateway` + `sim-exchange`.
#   live   the same chain, `gateway-kraken` against Kraken Futures with the trading key in
#          <root>/secrets/kraken.env. LIVE_ORDER_SUBMISSION=disabled (default) sends GET
#          requests only; every real order needs an explicit enable (README).
#
# Logs: every container writes to the host receiver on 127.0.0.1:5514, which stores
# <root>/logs/<container name>/YYYYMMDD.log. Start the receiver first (./algo does it).
name: algotrading

x-logging: &logging
  driver: syslog
  options:
    syslog-address: "tcp://127.0.0.1:5514"
    syslog-format: "rfc5424micro"
    tag: "{{.Name}}"
    mode: "non-blocking"
    max-buffer-size: "4m"
    # Small local cache so "docker logs" and "./algo logs" still work.
    cache-disabled: "false"
    cache-max-size: "25m"
    cache-max-file: "2"

# C++ trading services: one runtime image, stdout logging only.
x-runtime: &runtime
  image: ${RUNTIME_IMAGE:?set in chain.env}
  init: true
  restart: unless-stopped
  logging: *logging
  networks: [chain]
  environment:
    ALGOTRADING_LOG_DEBUG: ${LOG_DEBUG:-0}
    ALGOTRADING_LOG_QUIET: "0"
    ALGOTRADING_LOG_DIR: ""

# Health of a C++ trading service: its executable is running. The pattern is anchored at
# argv[0], so neither the docker-init parent nor the check itself matches. The services
# have no in-loop heartbeat yet, so "healthy" means alive, not "trading correctly".
x-process-check: &process_check
  interval: 30s
  timeout: 5s
  retries: 2
  start_period: 20s

# Dashboard read model settings shared by dash-api and watchdog.
x-dashboard-environment: &dashboard_environment
  DASHBOARD_DATA_PROVIDER: real
  DASHBOARD_POSTGRES_DSN: host=postgres port=5432 dbname=algotrading_paper user=algotrading password=${POSTGRES_PASSWORD:?missing secrets/chain.env}
  DASHBOARD_NATS_URL: nats://nats:4222
  DASHBOARD_NATS_MONITOR_URL: http://nats:8222
  DASHBOARD_NATS_STREAM: ALGOTRADING_PAPER_RUNTIME
  DASHBOARD_RUNTIME_MODE: ${DASHBOARD_RUNTIME_MODE:?run through ./algo}
  DASHBOARD_MARKET_DATA_DB: /data/market/database.db
  DASHBOARD_MARKET_TOP_N: "50"
  DASHBOARD_MARKET_HISTORY_DAYS: ${MARKET_WARMUP_DAYS:-100}
  DASHBOARD_STRATEGY_UNIVERSE_N: "20"
  DASHBOARD_QUOTE_VOLUME: "true"
  DASHBOARD_QUOTE_VOLUME_FROM: ${QUOTE_VOLUME_FROM:-}
  DASHBOARD_RSI_ENTRY: ${RSI_ENTRY:-80}
  DASHBOARD_RSI_EXIT: ${RSI_EXIT:-70}
  DASHBOARD_SOURCE_PROBE_TIMEOUT: 1s
  DASHBOARD_EXECUTION_VENUE: ${DASHBOARD_EXECUTION_VENUE:?run through ./algo}
  DASHBOARD_VENUE_TARGET_ENVIRONMENT: ${DASHBOARD_VENUE_TARGET_ENVIRONMENT:?run through ./algo}
  DASHBOARD_EXCHANGE_GATEWAY_MODE: ${DASHBOARD_EXCHANGE_GATEWAY_MODE:?run through ./algo}
  DASHBOARD_ALERT_STORE_DIR: /data/watchdog
  DASHBOARD_MANUAL_AUDIT_DIR: /data/manual-audit
  DASHBOARD_ALERT_ACK_DIR: /data/alert-ack
  DASHBOARD_HOST_METRICS_FILE: /data/telemetry/host.json
  DASHBOARD_HOST_METRICS_PROJECT: algotrading
  # Live vs. fast-backtest study written by chain/comparison.py; empty disables the panel.
  DASHBOARD_PAPER_COMPARISON_FILE: ${PAPER_COMPARISON_FILE:-}
  # Binance -> Kraken symbol table checked against public Kraken prices (Symbol Mapping page).
  DASHBOARD_SYMBOL_MAP_FILE: /config/symbol_map.json

services:
  # ---------------------------------------------------------------- setup
  # One-shot: create data folders with the owners the containers need.
  # 10001 = runtime user (market SQLite, venue journal), 70 = postgres user of the dashboard image.
  data-init:
    image: alpine:3.20
    container_name: data-init
    restart: "no"
    logging: *logging
    network_mode: none
    command:
      - sh
      - -c
      - >-
        mkdir -p /state/market /state/venue /state/dashboard/watchdog /state/dashboard/audit
        /state/dashboard/alerts /state/dashboard/notifier /state/comparison
        /state/manual/requests /state/manual/processed
        /data/dashboard/kraken-notifier /data/telemetry &&
        chown 10001:10001 /state/market /state/venue && chmod 0777 /state/market && chmod 0700 /state/venue &&
        chown 10001:10001 /state/manual /state/manual/requests /state/manual/processed &&
        chmod 2770 /state/manual /state/manual/requests /state/manual/processed &&
        chown 70:70 /state/dashboard/watchdog /state/dashboard/audit /state/dashboard/alerts /state/dashboard/notifier
        /data/dashboard/kraken-notifier /reports
    volumes:
      - ${ALGO_DATA:?run through ./algo}:/data
      - ${ALGO_STATE:?run through ./algo}:/state
      - ${ALGO_REPORTS:?run through ./algo}:/reports

  # ------------------------------------------------------------ messaging
  nats:
    image: nats:2.10-alpine
    container_name: nats
    restart: unless-stopped
    logging: *logging
    networks: [chain]
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    # /healthz answers 200 only when the server and JetStream are ready.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ${ALGO_STATE}/nats:/data

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *logging
    networks: [chain]
    environment:
      POSTGRES_DB: algotrading_paper
      POSTGRES_USER: algotrading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing secrets/chain.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotrading -d algotrading_paper"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ${ALGO_STATE}/postgres:/var/lib/postgresql/data

  # ---------------------------------------------------------- market data
  # One-shot: create or migrate the market SQLite schema before any reader starts.
  market-data-init:
    <<: *runtime
    container_name: market-data-init
    restart: "no"
    command: [algotrading_historical_market_data_service, --market-data-db, /data/market/database.db, --init-only]
    volumes:
      - ${ALGO_STATE}/market:/data/market
    depends_on:
      data-init: {condition: service_completed_successfully}

  market-data:
    <<: *runtime
    container_name: market-data
    command: [algotrading_market_data_service, --config, /config/market_data.json]
    healthcheck:
      <<: *process_check
      test: ["CMD", "pgrep", "-f", "^algotrading_market_data_service( |$$)"]
    volumes:
      - ${ALGO_STATE}/market:/data/market
      - ${ALGO_CONFIG:?run through ./algo}/market_data.json:/config/market_data.json:ro
    depends_on:
      nats: {condition: service_started}
      market-data-init: {condition: service_completed_successfully}

  # ------------------------------------------------------- trading chain
  strategy:
    <<: *runtime
    container_name: strategy
    healthcheck:
      <<: *process_check
      test: ["CMD", "pgrep", "-f", "^algotrading_strategy_service( |$$)"]
    command:
      - algotrading_strategy_service
      - --nats-url
      - nats://nats:4222
      - --stream
      - ALGOTRADING_PAPER_RUNTIME
      - --strategy-config
      - /config/strategies/${STRATEGY_FILE:?set in chain.env}
      - --market-data-db
      - /data/market/database.db
      - --market-warmup-days
      - ${MARKET_WARMUP_DAYS:-100}
      - --market-top-n
      - "50"
      - --market-data-source
      - binance
      - --postgres
      - host=postgres port=5432 dbname=algotrading_paper user=algotrading password=${POSTGRES_PASSWORD}
    volumes:
      - ${ALGO_STATE}/market:/data/market
      - ${ALGO_CONFIG}/strategies:/config/strategies:ro
    depends_on:
      nats: {condition: service_started}
      postgres: {condition: service_healthy}
      market-data-init: {condition: service_completed_successfully}

  risk:
    <<: *runtime
    container_name: risk
    healthcheck:
      <<: *process_check
      test: ["CMD", "pgrep", "-f", "^algotrading_portfolio_risk_service( |$$)"]
    command:
      - algotrading_portfolio_risk_service
      - --nats-url
      - nats://nats:4222
      - --stream
      - ALGOTRADING_PAPER_RUNTIME
      - --portfolio-config
      - /config/portfolio/${PORTFOLIO_FILE:?set in chain.env}
      - --market-data-db
      - /data/market/database.db
      - --market-history-buffer-days
      - "5"
      # "yes" only for the one start after a deliberate PORTFOLIO_FILE change (README).
      - --adopt-portfolio-config
      - ${RISK_ADOPT_PORTFOLIO_CONFIG:-no}
      - --postgres
      - host=postgres port=5432 dbname=algotrading_paper user=algotrading password=${POSTGRES_PASSWORD}
    volumes:
      - ${ALGO_STATE}/market:/data/market
      - ${ALGO_CONFIG}/portfolio:/config/portfolio:ro
    depends_on:
      nats: {condition: service_started}
      postgres: {condition: service_healthy}
      market-data-init: {condition: service_completed_successfully}

  planner:
    <<: *runtime
    container_name: planner
    healthcheck:
      <<: *process_check
      test: ["CMD", "pgrep", "-f", "^algotrading_order_planner_service( |$$)"]
    command:
      - algotrading_order_planner_service
      - --nats-url
      - nats://nats:4222
      - --stream
      - ALGOTRADING_PAPER_RUNTIME
      - --postgres
      - host=postgres port=5432 dbname=algotrading_paper user=algotrading password=${POSTGRES_PASSWORD}
    depends_on:
      nats: {condition: service_started}
      postgres: {condition: service_healthy}

  execution:
    <<: *runtime
    container_name: execution
    healthcheck:
      <<: *process_check
      test: ["CMD", "pgrep", "-f", "^algotrading_execution_state_service( |$$)"]
    command:
      - algotrading_execution_state_service
      - --nats-url
      - nats://nats:4222
      - --postgres
      - host=postgres port=5432 dbname=algotrading_paper user=algotrading password=${POSTGRES_PASSWORD}
      - --stream
      - ALGOTRADING_PAPER_RUNTIME
      - --exchange-control-stream
      - ALGOTRADING_PAPER_EXCHANGE_CONTROL
      - --market-data-db
      - /data/market/database.db
      - --market-data-source
      - binance
      - --initial-cash
      - ${INITIAL_CASH:?set in chain.env}
      - --strategy
      - 1:Pure_RSI
      # Re-check the exchange hourly 01:00-23:00 UTC and at 23:50 (not only at startup).
      - --periodic-reconciliation
      # Manual Control: requests from the dashboard, executed at once at the current
      # Binance prices within the portfolio risk limits (deploy/chain/README.md).
      - --manual-dir
      - /data/manual
      - --portfolio-config
      - /config/portfolio/${PORTFOLIO_FILE}
      - --price-url
      - https://fapi.binance.com
      # Cash difference accepted by reconciliation: exact in PAPER, 0.50 USD in LIVE (./algo).
      - --cash-tolerance-usd
      - ${CASH_TOLERANCE_USD:-0.000001}
    volumes:
      - ${ALGO_STATE}/market:/data/market
      - ${ALGO_STATE}/manual:/data/manual
      - ${ALGO_CONFIG}/portfolio:/config/portfolio:ro
    depends_on:
      nats: {condition: service_started}
      postgres: {condition: service_healthy}
      data-init: {condition: service_completed_successfully}
      market-data-init: {condition: service_completed_successfully}

  # PAPER: commands go to the simulated exchange through the backend stream.
  gateway:
    <<: *runtime
    container_name: gateway
    healthcheck:
      <<: *process_check
      test: ["CMD", "pgrep", "-f", "^algotrading_exchange_gateway( |$$)"]
    profiles: [paper]
    command:
      - algotrading_exchange_gateway
      - --nats-url
      - nats://nats:4222
      - --stream
      - ALGOTRADING_PAPER_RUNTIME
      - --control-stream
      - ALGOTRADING_PAPER_EXCHANGE_CONTROL
      - --backend-stream
      - ALGOTRADING_PAPER_EXCHANGE_BACKEND
      - --mode
      - backend
      - --poll-timeout-ms
      - "50"
    depends_on:
      nats: {condition: service_started}

  # PAPER venue: virtual account and simulated fills.
  sim-exchange:
    <<: *runtime
    container_name: sim-exchange
    healthcheck:
      <<: *process_check
      test: ["CMD", "pgrep", "-f", "^algotrading_simulated_exchange_service( |$$)"]
    profiles: [paper]
    command:
      - algotrading_simulated_exchange_service
      - --nats-url
      - nats://nats:4222
      - --stream
      - ALGOTRADING_PAPER_RUNTIME
      - --backend-stream
      - ALGOTRADING_PAPER_EXCHANGE_BACKEND
      - --postgres
      - host=postgres port=5432 dbname=algotrading_paper user=algotrading password=${POSTGRES_PASSWORD}
      - --initial-cash
      - ${INITIAL_CASH}
      - --commission-rate
      - ${COMMISSION_RATE:?set in chain.env}
      - --poll-timeout-ms
      - "50"
    depends_on:
      nats: {condition: service_started}
      postgres: {condition: service_healthy}

  # LIVE: the same commands go to Kraken Futures (live_trading/exchange_gateway/README.md).
  # Orders are journaled in data/live/venue before they are sent; symbols and units come from
  # the symbol map. LIVE_ORDER_SUBMISSION=disabled keeps it read-only (GET requests only).
  gateway-kraken:
    <<: *runtime
    container_name: gateway-kraken
    healthcheck:
      <<: *process_check
      test: ["CMD", "pgrep", "-f", "^algotrading_exchange_gateway( |$$)"]
    profiles: [live]
    command:
      - algotrading_exchange_gateway
      - --nats-url
      - nats://nats:4222
      - --stream
      - ALGOTRADING_PAPER_RUNTIME
      - --control-stream
      - ALGOTRADING_PAPER_EXCHANGE_CONTROL
      - --backend-stream
      - ALGOTRADING_PAPER_EXCHANGE_BACKEND
      - --mode
      - venue
      - --venue
      - kraken-futures
      - --credentials-file
      - /secrets/kraken.env
      - --symbol-map
      - /config/symbol_map.json
      - --venue-journal
      - /data/venue/journal.sqlite
      # Part of every client order id; change it after any reset of data/live (README).
      - --account-namespace
      - ${LIVE_ACCOUNT_NAMESPACE:-}  # required for MODE=live; ./algo checks it
      - --order-submission
      - ${LIVE_ORDER_SUBMISSION:-disabled}
      - --dead-mans-switch-seconds
      - ${LIVE_DEAD_MANS_SWITCH_SECONDS:-0}
      - --poll-timeout-ms
      - "50"
    volumes:
      - ${ALGO_STATE}/venue:/data/venue
      - ${ALGO_SECRETS:?run through ./algo}/kraken.env:/secrets/kraken.env:ro
      - ./config/venues/kraken_futures/symbol_map.json:/config/symbol_map.json:ro
    depends_on:
      nats: {condition: service_started}
      data-init: {condition: service_completed_successfully}

  # ------------------------------------------------------------ dashboard
  dash-api:
    image: ${DASH_API_IMAGE:?set in chain.env}
    container_name: dash-api
    restart: unless-stopped
    logging: *logging
    networks:
      chain:
        # The web image's Caddyfile proxies /api to dashboard-api:8080.
        aliases: [dashboard-api]
    group_add: ["10001"]
    environment:
      <<: *dashboard_environment
      DASHBOARD_AUTH_ALLOW_DEMO: "false"
      DASHBOARD_AUTH_COOKIE_SECURE: "false"
      DASHBOARD_VIEWER_PASSWORD: ${DASHBOARD_VIEWER_PASSWORD:?missing secrets/chain.env}
      # Manual Control needs the OPERATOR login; empty = no operator account.
      DASHBOARD_OPERATOR_PASSWORD: ${DASHBOARD_OPERATOR_PASSWORD:-}
      DASHBOARD_MANUAL_REQUEST_DIR: /data/manual
      DASHBOARD_LIVE_ORDER_SUBMISSION: ${LIVE_ORDER_SUBMISSION:-disabled}
      # CPU/RAM/disk history written by chain/monitor.py (30 s rows, 7 days).
      DASHBOARD_HOST_HISTORY_FILE: /data/telemetry/history.jsonl
      # closed_positions.csv and closed_positions_<YEAR>.csv, rewritten every 10 minutes.
      DASHBOARD_REPORTS_DIR: /reports
      # Kraken LIVE Overview: BTC collateral, margin headroom, drop to maintenance, written
      # every 30 s by algotrading-kraken.service (absent until it is enabled).
      DASHBOARD_KRAKEN_ACCOUNT_FILE: /data/kraken_account/account.json
    volumes:
      - ${ALGO_REPORTS}:/reports
      - ${ALGO_DATA}/kraken_account:/data/kraken_account:ro
      - ${ALGO_STATE}/market:/data/market:ro
      - ${ALGO_DATA}/telemetry:/data/telemetry:ro
      - ${ALGO_STATE}/dashboard/watchdog:/data/watchdog:ro
      - ${ALGO_STATE}/dashboard/audit:/data/manual-audit
      - ${ALGO_STATE}/dashboard/alerts:/data/alert-ack
      - ${ALGO_STATE}/comparison:/data/comparison:ro
      - ${ALGO_STATE}/manual:/data/manual
      - ./config/venues/kraken_futures/symbol_map.json:/config/symbol_map.json:ro
    depends_on:
      data-init: {condition: service_completed_successfully}

  dash-web:
    image: ${DASH_WEB_IMAGE:?set in chain.env}
    container_name: dash-web
    restart: unless-stopped
    logging: *logging
    networks: [chain]
    # Loopback only; on the VPS use an SSH tunnel.
    ports:
      - 127.0.0.1:${DASHBOARD_PORT:-8092}:80
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 96
    depends_on:
      dash-api: {condition: service_healthy}

  # Evaluates alert conditions every 15 s; writes data/dashboard/watchdog.
  watchdog:
    image: ${DASH_API_IMAGE}
    container_name: watchdog
    entrypoint: [/dashboard-watchdog]
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    logging: *logging
    networks: [chain]
    group_add: ["10001"]
    environment:
      <<: *dashboard_environment
      DASHBOARD_WATCHDOG_INTERVAL: 15s
      DASHBOARD_WATCHDOG_SWEEP_TIMEOUT: 8s
    volumes:
      - ${ALGO_STATE}/market:/data/market:ro
      - ${ALGO_DATA}/telemetry:/data/telemetry:ro
      - ${ALGO_STATE}/dashboard/watchdog:/data/watchdog
      - ${ALGO_STATE}/comparison:/data/comparison:ro
      - ./config/venues/kraken_futures/symbol_map.json:/config/symbol_map.json:ro
    mem_limit: 64m
    cpus: 0.2
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/watchdog/status.json"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      data-init: {condition: service_completed_successfully}

  # Sends watchdog alerts. NOTIFIER_SINK=TEST_FILE writes data/dashboard/notifier;
  # TELEGRAM uses the bot settings from secrets/chain.env.
  notifier:
    image: ${DASH_API_IMAGE}
    container_name: notifier
    entrypoint: [/dashboard-alert-notifier]
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    logging: *logging
    networks: [chain]
    environment:
      DASHBOARD_ALERT_STORE_DIR: /data/watchdog
      DASHBOARD_NOTIFIER_TEST_SINK_FILE: /data/notifier/test-sink.jsonl
      DASHBOARD_NOTIFIER_SOURCE_NAME: Watchdog
      DASHBOARD_NOTIFIER_SOURCE_STALE_WARNING_SECONDS: ${DASHBOARD_NOTIFIER_SOURCE_STALE_WARNING_SECONDS:-300}
      DASHBOARD_NOTIFIER_SINK: ${NOTIFIER_SINK:-TEST_FILE}
      DASHBOARD_TELEGRAM_BOT_TOKEN: ${DASHBOARD_TELEGRAM_BOT_TOKEN:-}
      DASHBOARD_TELEGRAM_CHAT_ID: ${DASHBOARD_TELEGRAM_CHAT_ID:-}
      DASHBOARD_TELEGRAM_CRITICAL_CHAT_ID: ${DASHBOARD_TELEGRAM_CRITICAL_CHAT_ID:-}
      DASHBOARD_NOTIFIER_MIN_SEVERITY: WARN
      DASHBOARD_NOTIFIER_INTERVAL: 5s
      DASHBOARD_NOTIFIER_COOLDOWN: 5m
    volumes:
      - ${ALGO_STATE}/dashboard/watchdog:/data/watchdog:ro
      - ${ALGO_STATE}/dashboard/notifier:/data/notifier
    mem_limit: 48m
    cpus: 0.15
    pids_limit: 48
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid,nodev"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck: &notifier_check
      # Healthy after one successful sweep without an error (store differs per sink).
      test:
        - CMD-SHELL
        - >-
          store="$${DASHBOARD_NOTIFIER_STORE_DIR:-}";
          if [ -z "$$store" ]; then store=/data/notifier; if [ "$${DASHBOARD_NOTIFIER_SINK:-TEST_FILE}" = TELEGRAM ]; then store=/data/notifier/telegram; fi; fi;
          test -s "$$store/status.json" && grep -q '"lastSuccessAt"' "$$store/status.json" && ! grep -q '"lastError"' "$$store/status.json"
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      data-init: {condition: service_completed_successfully}

  # Sends the Kraken account monitor's warnings and daily portfolio to Telegram.
  # The monitor itself is the host unit algotrading-kraken.service (read-only account
  # key in <root>/secrets/kraken_readonly.env); it writes data/kraken_account. Enabled
  # with COMPOSE_PROFILES=kraken in chain.env. Warning-only: nothing here trades.
  kraken-notifier:
    image: ${DASH_API_IMAGE}
    healthcheck: *notifier_check
    container_name: kraken-notifier
    profiles: [kraken]
    entrypoint: [/dashboard-alert-notifier]
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    logging: *logging
    network_mode: bridge  # Telegram only; no access to the chain network.
    environment:
      DASHBOARD_ALERT_STORE_DIR: /source
      DASHBOARD_NOTIFIER_STORE_DIR: /data/notifier
      DASHBOARD_NOTIFIER_SOURCE_NAME: Kraken
      DASHBOARD_NOTIFIER_SOURCE_STALE_WARNING_SECONDS: ${DASHBOARD_NOTIFIER_SOURCE_STALE_WARNING_SECONDS:-300}
      DASHBOARD_NOTIFIER_TEST_SINK_FILE: /data/notifier/test-sink.jsonl
      DASHBOARD_NOTIFIER_SINK: ${KRAKEN_NOTIFIER_SINK:-TELEGRAM}
      DASHBOARD_TELEGRAM_BOT_TOKEN: ${DASHBOARD_TELEGRAM_BOT_TOKEN:-}
      DASHBOARD_TELEGRAM_CHAT_ID: ${DASHBOARD_TELEGRAM_CHAT_ID:-}
      DASHBOARD_TELEGRAM_CRITICAL_CHAT_ID: ${DASHBOARD_TELEGRAM_CRITICAL_CHAT_ID:-}
      DASHBOARD_TELEGRAM_RECEIPT_FILE: /data/notifier/telegram-receipts.jsonl
      # INFO carries the daily portfolio summary.
      DASHBOARD_NOTIFIER_MIN_SEVERITY: INFO
      DASHBOARD_NOTIFIER_INTERVAL: 5s
    volumes:
      - ${ALGO_DATA}/kraken_account:/source:ro
      - ${ALGO_DATA}/dashboard/kraken-notifier:/data/notifier
    mem_limit: 48m
    cpus: 0.15
    pids_limit: 48
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid,nodev"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      data-init: {condition: service_completed_successfully}

networks:
  chain: {}
