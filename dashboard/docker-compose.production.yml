services:
  dashboard-api:
    build:
      context: ./dashboard-api
    container_name: control-dashboard-api
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    expose:
      - "8080"
    environment:
      DASHBOARD_API_ADDR: ":8080"
      DASHBOARD_DATA_PROVIDER: ${DASHBOARD_DATA_PROVIDER:?Set DASHBOARD_DATA_PROVIDER in .env.production}
      DASHBOARD_POSTGRES_DSN: ${DASHBOARD_POSTGRES_DSN:-}
      DASHBOARD_NATS_URL: ${DASHBOARD_NATS_URL:-}
      DASHBOARD_NATS_MONITOR_URL: ${DASHBOARD_NATS_MONITOR_URL:-}
      DASHBOARD_RUNTIME_MODE: ${DASHBOARD_RUNTIME_MODE:-LIVE}
      DASHBOARD_MARKET_DATA_DB: ${DASHBOARD_MARKET_DATA_DB:-}
      DASHBOARD_AUTH_ALLOW_DEMO: "false"
      DASHBOARD_AUTH_COOKIE_SECURE: "true"
      DASHBOARD_SESSION_TTL: ${DASHBOARD_SESSION_TTL:-8h}
      DASHBOARD_RESOURCE_TIMEOUT: ${DASHBOARD_RESOURCE_TIMEOUT:-7s}
      DASHBOARD_SSE_MAX_CLIENTS: ${DASHBOARD_SSE_MAX_CLIENTS:-16}
      DASHBOARD_VIEWER_USERNAME: ${DASHBOARD_VIEWER_USERNAME:-viewer}
      DASHBOARD_VIEWER_PASSWORD: ${DASHBOARD_VIEWER_PASSWORD:?Set DASHBOARD_VIEWER_PASSWORD in .env.production}
      DASHBOARD_OPERATOR_USERNAME: ${DASHBOARD_OPERATOR_USERNAME:-operator}
      DASHBOARD_OPERATOR_PASSWORD: ${DASHBOARD_OPERATOR_PASSWORD:?Set DASHBOARD_OPERATOR_PASSWORD in .env.production}
    mem_limit: 64m
    cpus: 0.20
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - dashboard-private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard-web:
    build:
      context: .
      args:
        VITE_DASHBOARD_DATA_MODE: api
        VITE_DASHBOARD_API_BASE_URL: /api
        VITE_DASHBOARD_API_TIMEOUT_MS: 8000
    container_name: control-dashboard-web
    restart: unless-stopped
    init: true
    depends_on:
      dashboard-api:
        condition: service_healthy
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - dashboard-public
      - dashboard-private
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -qx ok"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dashboard-public:
    driver: bridge
  dashboard-private:
    driver: bridge
    internal: true

volumes:
  caddy-data:
  caddy-config:
