# Real-source/control-preview/streaming overlay through Step 46B.
# Start deploy/live first, then run this compose with deploy/live/.env.
services:
  dashboard-api:
    environment:
      DASHBOARD_DATA_PROVIDER: "real"
      DASHBOARD_POSTGRES_DSN: "host=postgres port=5432 dbname=${POSTGRES_DB:-algotrading} user=${POSTGRES_USER:-algotrading} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}"
      DASHBOARD_NATS_URL: "nats://nats:4222"
      DASHBOARD_NATS_MONITOR_URL: "http://nats:8222"
      DASHBOARD_NATS_STREAM: "ALGOTRADING_RUNTIME"
      DASHBOARD_RUNTIME_MODE: "LIVE"
      DASHBOARD_MARKET_DATA_DB: "/data/market/database.db"
      DASHBOARD_MARKET_TOP_N: "${MARKET_TOP_N:-50}"
      DASHBOARD_MARKET_HISTORY_DAYS: "${MARKET_WARMUP_DAYS:-100}"
      DASHBOARD_STRATEGY_UNIVERSE_N: "20"
      DASHBOARD_SOURCE_PROBE_TIMEOUT: "1s"
      DASHBOARD_EXECUTION_VENUE: "HYPERLIQUID"
      DASHBOARD_VENUE_TARGET_ENVIRONMENT: "TESTNET"
      DASHBOARD_EXCHANGE_GATEWAY_MODE: "hyperliquid-dry-run"
      DASHBOARD_HYPERLIQUID_PUBLIC_INFO_URL: "https://api.hyperliquid-testnet.xyz/info"
      DASHBOARD_HYPERLIQUID_PUBLIC_TIMEOUT: "3s"
      DASHBOARD_ALERT_STORE_DIR: "/data/watchdog"
      DASHBOARD_MANUAL_AUDIT_DIR: "/data/manual-audit"
      DASHBOARD_ALERT_ACK_DIR: "/data/alert-ack"
    # SQLite in WAL mode may need writable sidecar/locking files (-shm) even
    # for a SQLITE_OPEN_READONLY connection. The directory is therefore
    # writable for sidecar bookkeeping, while the canonical database file
    # itself is over-mounted read-only. dashboard-api still invokes sqlite3
    # with -readonly + PRAGMA query_only=ON.
    volumes:
      - ../storage/databases:/data/market
      - ../storage/databases/database.db:/data/market/database.db:ro
      - dashboard-watchdog-data:/data/watchdog:ro
      - dashboard-manual-audit-data:/data/manual-audit
      - dashboard-alert-ack-data:/data/alert-ack
    networks:
      - dashboard-private
      - algotrading-live

  dashboard-watchdog:
    build:
      context: ./dashboard-api
    container_name: control-dashboard-watchdog
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    entrypoint: ["/dashboard-watchdog"]
    environment:
      DASHBOARD_POSTGRES_DSN: "host=postgres port=5432 dbname=${POSTGRES_DB:-algotrading} user=${POSTGRES_USER:-algotrading} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}"
      DASHBOARD_NATS_URL: "nats://nats:4222"
      DASHBOARD_NATS_MONITOR_URL: "http://nats:8222"
      DASHBOARD_NATS_STREAM: "ALGOTRADING_RUNTIME"
      DASHBOARD_RUNTIME_MODE: "LIVE"
      DASHBOARD_MARKET_DATA_DB: "/data/market/database.db"
      DASHBOARD_MARKET_TOP_N: "${MARKET_TOP_N:-50}"
      DASHBOARD_MARKET_HISTORY_DAYS: "${MARKET_WARMUP_DAYS:-100}"
      DASHBOARD_STRATEGY_UNIVERSE_N: "20"
      DASHBOARD_SOURCE_PROBE_TIMEOUT: "1s"
      DASHBOARD_EXECUTION_VENUE: "HYPERLIQUID"
      DASHBOARD_VENUE_TARGET_ENVIRONMENT: "TESTNET"
      DASHBOARD_EXCHANGE_GATEWAY_MODE: "hyperliquid-dry-run"
      DASHBOARD_HYPERLIQUID_PUBLIC_INFO_URL: "https://api.hyperliquid-testnet.xyz/info"
      DASHBOARD_HYPERLIQUID_PUBLIC_TIMEOUT: "3s"
      DASHBOARD_ALERT_STORE_DIR: "/data/watchdog"
      DASHBOARD_WATCHDOG_INTERVAL: "15s"
      DASHBOARD_WATCHDOG_SWEEP_TIMEOUT: "8s"
    volumes:
      - ../storage/databases:/data/market
      - ../storage/databases/database.db:/data/market/database.db:ro
      - dashboard-watchdog-data:/data/watchdog
    mem_limit: 64m
    cpus: 0.20
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/watchdog/status.json"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks:
      - dashboard-private
      - algotrading-live

  dashboard-alert-notifier:
    build:
      context: ./dashboard-api
    container_name: control-dashboard-alert-notifier
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    entrypoint: ["/dashboard-alert-notifier"]
    environment:
      DASHBOARD_ALERT_STORE_DIR: "/data/watchdog"
      DASHBOARD_NOTIFIER_STORE_DIR: "${DASHBOARD_NOTIFIER_STORE_DIR:-}"
      DASHBOARD_NOTIFIER_TEST_SINK_FILE: "/data/notifier/test-sink.jsonl"
      DASHBOARD_NOTIFIER_SINK: "${DASHBOARD_NOTIFIER_SINK:-TEST_FILE}"
      DASHBOARD_TELEGRAM_BOT_TOKEN: "${DASHBOARD_TELEGRAM_BOT_TOKEN:-}"
      DASHBOARD_TELEGRAM_BOT_TOKEN_FILE: "${DASHBOARD_TELEGRAM_BOT_TOKEN_FILE:-}"
      DASHBOARD_TELEGRAM_CHAT_ID: "${DASHBOARD_TELEGRAM_CHAT_ID:-}"
      DASHBOARD_TELEGRAM_CHAT_ID_FILE: "${DASHBOARD_TELEGRAM_CHAT_ID_FILE:-}"
      DASHBOARD_TELEGRAM_RECEIPT_FILE: "${DASHBOARD_TELEGRAM_RECEIPT_FILE:-}"
      DASHBOARD_TELEGRAM_REQUEST_TIMEOUT: "${DASHBOARD_TELEGRAM_REQUEST_TIMEOUT:-8s}"
      DASHBOARD_NOTIFIER_MIN_SEVERITY: "${DASHBOARD_NOTIFIER_MIN_SEVERITY:-WARN}"
      DASHBOARD_NOTIFIER_INTERVAL: "${DASHBOARD_NOTIFIER_INTERVAL:-5s}"
      DASHBOARD_NOTIFIER_COOLDOWN: "${DASHBOARD_NOTIFIER_COOLDOWN:-5m}"
      DASHBOARD_NOTIFIER_SWEEP_TIMEOUT: "${DASHBOARD_NOTIFIER_SWEEP_TIMEOUT:-10s}"
      DASHBOARD_NOTIFIER_SOURCE_MAX_BYTES: "${DASHBOARD_NOTIFIER_SOURCE_MAX_BYTES:-67108864}"
    volumes:
      - dashboard-watchdog-data:/data/watchdog:ro
      - dashboard-alert-notifier-data:/data/notifier
    mem_limit: 48m
    cpus: 0.15
    pids_limit: 48
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "store=$${DASHBOARD_NOTIFIER_STORE_DIR:-}; if [ -z \"$$store\" ]; then if [ \"$${DASHBOARD_NOTIFIER_SINK:-TEST_FILE}\" = TELEGRAM ]; then store=/data/notifier/telegram; else store=/data/notifier; fi; fi; test -s \"$$store/status.json\" && grep -q '\"lastSuccessAt\"' \"$$store/status.json\""]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks:
      - dashboard-notifier-egress

networks:
  dashboard-notifier-egress:
    driver: bridge
  algotrading-live:
    external: true
    name: algotrading-live_live

volumes:
  dashboard-watchdog-data:
  dashboard-manual-audit-data:
  dashboard-alert-ack-data:
  dashboard-alert-notifier-data:
